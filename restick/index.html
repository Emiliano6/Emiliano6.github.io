<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restick</title>
<meta name="description" content="Restick exporta tus stickers favoritos de TikTok a paquetes de WhatsApp, en tu teléfono.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
:root { --ground: #E3E2D9; --raised: #ECEBE4; --ink: #25231D; --muted: #5C584D; --line: #C7C4B8; --gold: #8A6516; }
@media (prefers-color-scheme: dark) {
  :root { --ground: #191814; --raised: #24221C; --ink: #ECE7DB; --muted: #A9A292; --line: #3A362D; --gold: #D9B562; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; display: flex; align-items: center; background: var(--ground); color: var(--ink);
  font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { width: 100%; max-width: 34rem; margin: 0 auto; padding: 48px 20px; }
img { width: 96px; height: 96px; display: block; margin-bottom: 20px; }
h1 { font-size: 2.6rem; line-height: 1.1; margin: 0 0 12px; letter-spacing: -0.02em; }
p { margin: 0 0 16px; }
.lead { font-size: 1.2rem; }
.muted { color: var(--muted); font-size: 0.95rem; }
nav { display: flex; flex-wrap: wrap; gap: 10px 20px; margin: 28px 0; }
a { color: var(--gold); text-underline-offset: 3px; }
</style>
</head>
<body>
<main>
<img src="logo.svg" alt="Logo de Restick">
<h1>Restick</h1>
<p class="lead">Exporta tus stickers favoritos de TikTok a paquetes de WhatsApp. Todo se prepara en tu teléfono.</p>
<p class="muted">Restick no está afiliada a TikTok, WhatsApp ni Meta, ni cuenta con su respaldo.</p>
</main>
</body>
</html>
